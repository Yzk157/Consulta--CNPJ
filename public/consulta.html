<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Consulta CNPJ</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 20% 30%, #3b0a70 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, #082567 0%, transparent 30%),
                radial-gradient(circle at 50% 50%, #15002b 0%, transparent 60%),
                #02010a;

            overflow: hidden;
        }

        /* Estrelas */
        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                radial-gradient(white 1px, transparent 1px),
                radial-gradient(white 1px, transparent 1px);

            background-size: 90px 90px, 140px 140px;
            background-position: 10px 20px, 50px 70px;

            opacity: 0.35;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;

            width: 90%;
            max-width: 450px;

            padding: 40px;

            background: rgba(10, 5, 30, 0.75);

            border: 1px solid rgba(150, 100, 255, 0.4);
            border-radius: 20px;

            box-shadow:
                0 0 30px rgba(110, 50, 255, 0.3),
                inset 0 0 30px rgba(100, 50, 255, 0.05);

            backdrop-filter: blur(10px);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;

            font-size: 30px;

            background: linear-gradient(
                90deg,
                #8f5cff,
                #d8b4ff,
                #6ea8ff
            );

            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            text-align: center;
            margin-bottom: 30px;

            color: #aaa4bd;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            color: #d8d0e8;
            font-size: 14px;
        }

        [hidden] {
            display: none !important;
        }

        input {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid #49356b;
            border-radius: 10px;

            background: rgba(255, 255, 255, 0.05);

            color: white;
            font-size: 16px;

            outline: none;

            transition: 0.3s;
        }

        input::placeholder {
            color: #777080;
        }

        input:focus {
            border-color: #8f5cff;

            box-shadow:
                0 0 15px rgba(143, 92, 255, 0.35);

            background: rgba(255, 255, 255, 0.08);
        }

        select {
            width: 100%;
            margin-bottom: 22px;
            padding: 14px 44px 14px 16px;
            border: 1px solid #49356b;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.08);
            background-image: linear-gradient(45deg, transparent 50%, #d8b4ff 50%),
                linear-gradient(135deg, #d8b4ff 50%, transparent 50%);
            background-position: calc(100% - 20px) 20px, calc(100% - 14px) 20px;
            background-size: 6px 6px, 6px 6px;
            background-repeat: no-repeat;
            color: white;
            font-size: 16px;
            outline: none;
            appearance: none;
            cursor: pointer;
            transition: 0.3s;
        }

        select:focus {
            border-color: #8f5cff;
            box-shadow: 0 0 15px rgba(143, 92, 255, 0.35);
        }

        option {
            background: #15002b;
            color: white;
        }

        button {
            width: 100%;

            margin-top: 20px;
            padding: 14px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #6c35d9,
                #8f5cff
            );

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 20px rgba(143, 92, 255, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        #resultado {
            display: none;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid rgba(150, 100, 255, 0.3);
            color: #d8d0e8;
            line-height: 1.8;
        }

        #mensagem {
            display: block;
            margin-top: 12px;
            color: #ffb4b4;
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Painel Consulta</h1>

        <p>
            Consulte informações de uma empresa ou pessoa fisica.
        </p>

        <form action="/" method="POST">

            <label for="tipoConsulta">
                Tipo de consulta
            </label>

            <select id="tipoConsulta" name="tipo">
                <option value="cnpj">CNPJ</option>
            </select>

            <label for="cnpj" id="labelCnpj">
                CNPJ
            </label>

            <input
                type="text"
                id="cnpj"
                name="cnpj"
                placeholder="00.000.000/0000-00"
                required
            >

            <button type="submit">
                Consultar
            </button>

        </form>

        <section id="resultado" aria-live="polite">
            <strong>Resultado da consulta</strong>
            <pre id="dadosResultado"></pre>
            <span id="mensagem"></span>
        </section>

    </main>

    <script>
        const formulario = document.querySelector('form');
        const resultado = document.querySelector('#resultado');
        const tipoConsulta = document.querySelector('#tipoConsulta');
        const campoCnpj = document.querySelector('#cnpj');
        const dadosResultado = document.querySelector('#dadosResultado');
        const mensagem = document.querySelector('#mensagem');

        formulario.addEventListener('submit', async (evento) => {
            evento.preventDefault();
            resultado.style.display = 'block';
            mensagem.textContent = 'Consultando...';

            try {
                const resposta = await fetch('/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo: tipoConsulta.value,
                        cnpj: campoCnpj.value
                    })
                });

                if (!resposta.ok) {
                    throw new Error(await resposta.text());
                }

                const dados = await resposta.json();
                dadosResultado.textContent = JSON.stringify(dados, null, 2);
                mensagem.textContent = '';
            } catch (erro) {
                mensagem.textContent = erro.message || 'Não foi possível realizar a consulta.';
            }
        });
    </script>

</body>
</html>
